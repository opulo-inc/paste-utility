<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap');
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="16x16" href="public/lumen-icon.png">
  <link rel="shortcut icon" type="image/x-icon" href="public/lumen-icon.png">
  
  <script src="opencv.js"></script>
  <script type="module" src="main.js"></script>
  
  <title>LumenPnP Pasting Utility</title>
</head>

<body>
  <div id="header-pill">
    <h1>LumenPnP Pasting Utility</h1>
  </div>
  <div id="top-controls">
    <a href="help.html"><button id="helpButton" style="background-color:gray;height:40px;padding:10px;">Docs</button></a>
    <select id="camera-select"></select>
    <button id="connect" type="button">Connect</button>
    <button id="disconnect" type="button">Disconnect</button>
  </div>

  <div id="main-app">
    
    <div id="leftColumn">
      
      <div class="section-container" id="jobPrep">
        <div class="import-section">
          <div class="button-row">
            <input type="file" id="jobFile" accept=".json" style="display: none;" />
            <input type="file" id="gerberFiles" accept=".zip,.gbr,.ger,.gtp,.gbp,.gts,.gbs,.pho,.art" multiple style="display: none;" />
            <button class="goldenrod-button" id="importJob" type="button">Import Job</button>
            OR
            <button class="goldenrod-button" id="importGerber" type="button">Import Gerber</button>
            <span id="gerberImportStatus"></span>
          </div>
        </div>
        <div class="settings-container">
          <div class="positions-section">
            <div class="positions-header">
              <h2>Job Positions</h2>
              <button id="getRoughBoardPosition" class="goldenrod-button">Get Rough Board Position</button>

              <button id="performFidCal" class="goldenrod-button">Perform Fid Cal</button>
              <button id="captureNewPos" class="goldenrod-button">Capture New Position</button>
            </div>
            <div class="positions-list">
            </div>
          </div>
          
        </div>

        <div class="gerber-visualization">
          <div class="gerber-visualization-container">
            <div class="gerber-visualization-controls">
              <button id="vizZoomIn" class="goldenrod-button" type="button" title="Zoom in">+</button>
              <button id="vizZoomOut" class="goldenrod-button" type="button" title="Zoom out">−</button>
              <button id="vizZoomReset" class="goldenrod-button" type="button" title="Reset view">⤢</button>
              <button id="vizTogglePads" class="goldenrod-button" type="button" title="Toggle pad outlines">▦</button>
            </div>
            <canvas id="pointViz" width="500" height="500"></canvas>
          </div>

        </div>

        <div class="settings-section">
          <h2>Extruder Settings</h2>
          <div class="settings-row">
            <div class="setting-item">
              <label for="jobDispenseDeg">Dispense Degrees:</label>
              <input type="number" id="jobDispenseDeg" min="1" max="300" value="30" />
            </div>
            <div class="setting-item">
              <label for="jobMotionSpeed">Motion Speed (mm/min):</label>
              <input type="number" id="jobMotionSpeed" min="1" max="50000" value="35000" />
            </div>
            <div class="setting-item">
              <label for="jobExtruderSpeed">Extruder Speed (mm/min):</label>
              <input type="number" id="jobExtruderSpeed" min="1" max="200000" value="100000" />
            </div>
            <div class="setting-item">
              <label for="jobMotorCurrent" title="Auger stepper current while dispensing paste">Pasting Motor Current (mA):</label>
              <input type="number" id="jobMotorCurrent" min="0" max="2000" step="10" value="450" />
            </div>
            <div class="setting-item">
              <label for="jobVacuumPressure">Air Assist: <span id="jobVacuumPressureValue">100</span>%</label>
              <input type="range" id="jobVacuumPressure" min="0" max="100" value="100" step="1" />
            </div>
            <div class="setting-item">
              <label for="jobTravelHeight" title="Z height the nozzle rests at while moving between pads during a run">Travel Height (mm):</label>
              <input type="number" id="jobTravelHeight" min="0" max="50" step="0.1" value="31.5" />
            </div>
          </div>
          <div class="settings-row" style="margin-top: 15px; justify-content: space-around;">
            <div class="setting-item" style="flex: 1;">
              <label for="jobPreGcode">Pre-gcode:</label>
              <textarea id="jobPreGcode" rows="4" style="width: 100%; font-family: monospace; resize: vertical; padding: 8px;" placeholder="G-code commands to run at the start of the job (one per line)"></textarea>
            </div>
            <div class="setting-item" style="flex: 1;">
              <label for="jobPostGcode">Post-gcode:</label>
              <textarea id="jobPostGcode" rows="4" style="width: 100%; font-family: monospace; resize: vertical; padding: 8px;" placeholder="G-code commands to run at the end of the job (one per line)"></textarea>
            </div>
          </div>
          <div class="settings-row" style="margin-top: 15px; justify-content: space-around;">
            <div class="setting-item">
              <label for="jobInvertDispense" style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                <input type="checkbox" id="jobInvertDispense" style="margin: 0;" />
                <span>Invert Dispense</span>
              </label>
            </div>
            <div class="setting-item">
              <button class="goldenrod-button" id="purgeAuger" type="button">Purge Auger</button>
            </div>
          </div>
          <div class="settings-row" style="margin-top: 15px; justify-content: space-around;">
            <div class="setting-item">
              <label>X Offset: <span id="x-offset-value">0.0mm</span></label>
              <div class="offset-tool">
                <button id="x-offset-down" class="goldenrod-button">-</button>
                <button id="x-offset-up" class="goldenrod-button">+</button>
              </div>
            </div>
            <div class="setting-item">
              <label>Y Offset: <span id="y-offset-value">0.0mm</span></label>
              <div class="offset-tool">
                <button id="y-offset-down" class="goldenrod-button">-</button>
                <button id="y-offset-up" class="goldenrod-button">+</button>
              </div>
            </div>
            <div class="setting-item">
              <label>Z Offset: <span id="z-offset-value">0.0mm</span></label>
              <div class="offset-tool">
                <button id="z-offset-down" class="goldenrod-button">▼</button>
                <button id="z-offset-up" class="goldenrod-button">▲</button>
              </div>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <div class="button-row">
            <button id="exportJob" class="goldenrod-button">Export Job</button>
            <button id="runJob" class="goldenrod-button">Run Job</button>
          </div>
        </div>
      </div>

      
    </div>

    <div id="rightColumn">
      <div class="video-feed">
        <canvas id="opencv-canvas"></canvas>
      </div>

      <div class="control-row">
        <button id="process-button" class="goldenrod-button">Jog to Fid in View</button>
        <button id="homing-fid-button" class="goldenrod-button">Visual Home</button>
        <button id="nozzleOffsetCal" class="goldenrod-button">Nozzle Offset Cal</button>

        
      </div>
      
      <div class="control-buttons"> 
        <div class="control-row">
          <button id="home-x">Home X</button>
          <button id="home-y">Home Y</button>
          <button id="home-z">Home Z</button>
        </div>
      </div>
      
      <div class="jog-controls">
        <div class="jog-buttons">
          <div class="jog-row">
            <button id="jog-yp" class="goldenrod-button">Y+</button>
          </div>
          <div class="jog-row">
            <button id="jog-xm" class="goldenrod-button">X-</button>
            
            <button id="jog-xp" class="goldenrod-button">X+</button>
          </div>
          <div class="jog-row">
            <button id="jog-ym" class="goldenrod-button">Y-</button>
          </div>
          <div class="jog-row">
            <button id="jog-zm" class="goldenrod-button">Z+</button>
            <button id="jog-zp" class="goldenrod-button">Z-</button>
          </div>
          <div class="jog-row">
            <button class="goldenrod-button" id="extrude-btn">Extrude</button>
          </div>
        </div>
        <div class="jog-slider-container">
          <input type="range" id="jog-distance" min="1" max="4" value="2" step="1" list="jog-distances">
          <datalist id="jog-distances">
            <option value="1">100mm</option>
            <option value="2">10mm</option>
            <option value="3">1mm</option>
            <option value="4">0.1mm</option>
          </datalist>
        </div>

      </div>

      <div class="control-row" style="margin-top:15px;">
        <button id="ring-lights-toggle">Ring Lights: Off</button>
      </div>

      <div class="control-row">
        <button id="left-air-toggle">Left Air: Off</button>
        <button id="right-air-toggle">Right Air: Off</button>
        <button id="left-vac">Left Vac</button>
        <button id="right-vac">Right Vac</button>
      </div>
    
      <div class="control-row">
        <button id="disable-steppers">Disable Steppers</button>
      </div>
      

      <div class="repl-section">
        <h3>Console</h3>
        <div id="console"></div>
        <div id="repl-bottom-row">
          <input id="repl-input" type="text" placeholder="Send Gcode" />
          <button id="send" type="button" class="goldenrod-button">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"><img src="public/opulo-gold-alpha-tiny.png"></div>

  <div id="modal">
    <div class="flex">
      <img src="public/lumen-icon.png">
      <button id="modal-close" class="btn-close">⨉</button>
    </div>

    <h2 id="modal-title">test</h2>
    <p id="modal-content">test</p>
    <input id="modal-num-input" min="1" max="254" type="number">
    <div class="flex">
      <button id="modal-ng">Cancel</button>
      <button id="modal-ok">OK</button>
    </div>
  </div>

  <div id="toast">
    <p id="toast-content">test</p>
    <button id="toast-close" class="btn-close">➡️</button>
  </div>



  <div id="overlay"></div>
</body>

</html>
